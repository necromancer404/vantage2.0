# Swap providers/models per agent without touching code.
# provider: openai_compat | anthropic | gemini | mock
# api_key_env: name of the environment variable holding the key

default:
  provider: openai_compat
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  base_url: https://api.openai.com/v1
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 90
  extra_headers: {}

# Optional per-agent overrides. Uncomment and change as needed.
agents:
  correctness: {}
  style: {}
  counteragent: {}
  edge_cases: {}
  complexity: {}

