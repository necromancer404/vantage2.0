# mix: name from config/models.yaml mixes. Applied unless you pass --preset or --mix.
# Leave mix empty and fill agents: if you want to assign models only here.
mix: mixed

default:
  provider: openai_compat
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  base_url: https://api.openai.com/v1
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 90
  extra_headers: {}

# Per-agent override. Use preset: <name from models.yaml> or a full provider block.
# Example:
#   correctness:
#     preset: nvidia-deepseek
#   style:
#     preset: groq
agents:
  correctness: {}
  style: {}
  counteragent: {}
  edge_cases: {}
  complexity: {}
