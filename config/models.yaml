# Named judge models. Switch with: python -m evalsys batch --preset groq
# Edit model IDs here when a provider renames them.

presets:
  gemini:
    label: Gemini 3.1 Flash-Lite
    provider: gemini
    model: gemini-3.1-flash-lite
    api_key_env: GEMINI_API_KEY
    base_url_env: GEMINI_BASE_URL
    base_url: https://generativelanguage.googleapis.com/v1beta
    temperature: 0.2
    max_tokens: 4096
    timeout_seconds: 120
  gemini-3.5-flash-lite:
    label: Gemini 3.5 Flash-Lite
    provider: gemini
    model: gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    base_url_env: GEMINI_BASE_URL
    base_url: https://generativelanguage.googleapis.com/v1beta
    temperature: 0.2
    max_tokens: 4096
    timeout_seconds: 120
  groq:
    label: Groq GPT-OSS 120B
    provider: groq
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    base_url_env: GROQ_BASE_URL
    base_url: https://api.groq.com/openai/v1
    token_field: max_completion_tokens
    max_tokens: 4096
    timeout_seconds: 90

  groq-llama:
    label: Groq Llama 3.3 70B
    provider: groq
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    base_url_env: GROQ_BASE_URL
    base_url: https://api.groq.com/openai/v1
    max_tokens: 2048

  nvidia-deepseek:
    label: DeepSeek V4 Flash via NVIDIA NIM
    provider: nvidia
    model: deepseek-ai/deepseek-v4-flash
    api_key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_BASE_URL
    base_url: https://integrate.api.nvidia.com/v1
    max_tokens: 4096
    timeout_seconds: 180

  poolside/laguna-s-2.1:free:
    label: Laguna s 2.1
    provider: openrouter
    model: poolside/laguna-s-2.1:free
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    max_tokens: 4096
    timeout_seconds: 180
  gemma-4:
    label: Gemma 4 31B
    provider: openrouter
    model: google/gemma-4-31b-it:free
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    max_tokens: 4096
    timeout_seconds: 180

  kimi-k3:
    label: Kimi K3
    provider: nvidia
    model: moonshotai/kimi-k3
    api_key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_BASE_URL
    base_url: https://integrate.api.nvidia.com/v1
    max_tokens: 4096
    timeout_seconds: 180

  nvidia-laguna-xs:
    label: Laguna XS 2.1 via NVIDIA NIM
    provider: nvidia
    model: poolside/laguna-xs-2.1
    api_key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_BASE_URL
    base_url: https://integrate.api.nvidia.com/v1
    max_tokens: 4096
    timeout_seconds: 180

  nvidia-gemma-4:
    label: Gemma 4 31B IT via NVIDIA NIM
    provider: nvidia
    model: google/gemma-4-31b-it
    api_key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_BASE_URL
    base_url: https://integrate.api.nvidia.com/v1
    max_tokens: 4096
    timeout_seconds: 300

  moonshot-kimi-k3:
    label: Moonshot Kimi K3
    provider: moonshot
    model: kimi-k3
    api_key_env: MOONSHOT_API_KEY
    base_url_env: MOONSHOT_BASE_URL
    base_url: https://api.moonshot.ai/v1
    send_temperature: false
    extra_body:
      reasoning_effort: low
    max_tokens: 4096
    timeout_seconds: 180

  openrouter-kimi-k3:
    label: moonshotai/kimi-k3 via OpenRouter
    provider: openrouter
    model: moonshotai/kimi-k3
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    extra_headers:
      HTTP-Referer: https://localhost
      X-Title: vantage-eval
    max_tokens: 4096
    timeout_seconds: 180

  qwen3-8:
    label: Qwen3 8B via Ollama
    provider: ollama
    model: qwen3:8b
    api_key_env: OLLAMA_API_KEY
    base_url_env: OLLAMA_BASE_URL
    base_url: http://localhost:11434
    max_tokens: 512
    timeout_seconds: 180
    extra_body:
      think: false

  qwen2.5-coder:14b:
      label: Qwen2.5 14B via Ollama
      provider: ollama
      model: qwen2.5-coder:14b
      api_key_env: OLLAMA_API_KEY
      base_url_env: OLLAMA_BASE_URL
      base_url: http://localhost:11434/
      max_tokens: 4096
      timeout_seconds: 180
      extra_body:
        think: false
    
  gemma3:12b:
      label: gemma3:12b via Ollama
      provider: ollama
      model: gemma3:12b
      api_key_env: OLLAMA_API_KEY
      base_url_env: OLLAMA_BASE_URL
      base_url: http://localhost:11434/v1
      max_tokens: 4096
      timeout_seconds: 180

  deepseek-r1:8b :
      label: deepseek-r1:8b  via Ollama
      provider: ollama
      model: deepseek-r1:8b
      api_key_env: OLLAMA_API_KEY
      base_url_env: OLLAMA_BASE_URL
      base_url: http://localhost:11434/v1
      max_tokens: 4096
      timeout_seconds: 180

  cerebras:
    label: Cerebras Qwen 3.8 27B
    provider: cerebras
    model: qwen-3.8-27b
    api_key_env: CEREBRAS_API_KEY
    base_url_env: CEREBRAS_BASE_URL
    base_url: https://api.cerebras.ai/v1
    max_tokens: 2048
    timeout_seconds: 180

  cerebras-gemma-4:
    label: Cerebras Gemma 4 31B
    provider: cerebras
    model: gemma-4-31b
    api_key_env: CEREBRAS_API_KEY
    base_url_env: CEREBRAS_BASE_URL
    base_url: https://api.cerebras.ai/v1
    max_tokens: 4096
    timeout_seconds: 120

  cerebras-gpt-oss:
    label: Cerebras GPT-OSS 120B
    provider: cerebras
    model: gpt-oss-120b
    api_key_env: CEREBRAS_API_KEY
    base_url_env: CEREBRAS_BASE_URL
    base_url: https://api.cerebras.ai/v1
    token_field: max_completion_tokens
    max_tokens: 4096
    timeout_seconds: 120

# Used by: python -m evalsys batch --sweep
test_suite:
  - gemini
  - groq
  - nvidia-deepseek
  - nvidia-laguna-xs
  - nvidia-gemma-4
  - moonshot-kimi-k3
  - cerebras

# Different model per agent. Default mix is `mixed`.
mixes:
  mixed:
    label: Gemma correctness, Gemini style/complexity, Cerebras Qwen edge/counter
    agents:
      correctness: qwen2.5-coder:14b
      style: gemini
      complexity: gemini-3.5-flash-lite
      edge_cases: gemini
      counteragent: gemini-3.5-flash-lite
  mixed-nvidia:
    label: NVIDIA models split across agents
    agents:
      correctness: nvidia-deepseek
      style: nvidia-gemma-4
      counteragent: nvidia-laguna-xs
      edge_cases: nvidia-gemma-4
      complexity: nvidia-deepseek
  mixed-groq-nvidia:
    label: Groq + NVIDIA only
    agents:
      correctness: nvidia-deepseek
      style: groq
      counteragent: nvidia-laguna-xs
      edge_cases: groq-llama
      complexity: nvidia-gemma-4
